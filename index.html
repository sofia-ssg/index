<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV with Text Boxes</title>
    <style>
        /* General Reset & Typography */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
            line-height: 1.4;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 50px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* Form Input Styling for Editing */
        input[type="text"], textarea {
            font-family: inherit;
            font-size: inherit;
            color: inherit;
            background-color: #fdfdfd;
            border: 1px solid #ccc;
            border-radius: 3px;
            padding: 4px;
            width: 100%;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        textarea {
            resize: vertical; /* Allows dragging to make the box taller */
            line-height: 1.4;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: #0078d7;
            background-color: #fff;
        }

        /* Specific Input Adjustments */
        input.title-input {
            font-size: 2.5rem;
            font-weight: bold;
            color: #000;
            margin-bottom: 30px;
            border: 1px solid #ccc;
            padding: 5px;
        }

        input.bold-input {
            font-weight: bold;
            color: #000;
            margin-bottom: 2px;
        }

        /* Top Personal Info Section */
        .personal-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 40px;
            gap: 20px;
        }

        .info-col {
            flex: 0 0 32%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .info-col-img {
            flex: 0 0 25%;
            display: flex;
            justify-content: flex-end;
            align-items: flex-start;
        }

        .info-item strong {
            display: block;
            margin-bottom: 3px;
            font-size: 1rem;
            color: #000;
        }

        .profile-pic {
            width: 140px;
            height: auto;
            object-fit: cover;
            border: 1px solid #eee;
        }

        /* Sections (Career, Education, Skills) */
        .section {
            margin-bottom: 0;
        }

        .section-header {
            background-color: #b3b3b3;
            color: #222;
            padding: 6px 12px;
            font-weight: bold;
            font-size: 1.1rem;
            margin-top: 25px;
        }

        .section-body {
            display: flex;
            flex-direction: column;
        }

        /* Row Layout */
        .row {
            display: flex;
            padding: 12px;
            gap: 15px;
        }

        .row:nth-child(even) {
            background-color: #f2f2f2;
        }

        .row:nth-child(odd) {
            background-color: #ffffff;
        }

        .row-left {
            flex: 0 0 28%;
            font-size: 0.95rem;
        }

        .row-right {
            flex: 0 0 72%;
            font-size: 0.95rem;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        /* Footer */
        .footer {
            margin-top: 40px;
            padding: 12px;
        }

        .footer p {
            margin: 0 0 10px 0;
            font-size: 0.95rem;
        }

        .signature img {
            height: 60px;
            width: auto;
        }

        /* --- MAGIC PRINT STYLES --- */
        /* When you print or save to PDF, this hides the text boxes and backgrounds */
        @media print {
            body {
                background-color: #fff;
                padding: 0;
            }
            .container {
                box-shadow: none;
                padding: 0;
            }
            input[type="text"], textarea {
                border: none !important;
                background-color: transparent !important;
                padding: 0 !important;
                margin: 0 !important;
                resize: none;
                overflow: hidden;
            }
            /* Adjust spacing slightly for print */
            .row { padding: 8px 12px; }
        }
    </style>
</head>
<body>

<div class="container">
    <input type="text" class="title-input" value="CV">

    <div class="personal-info">
        <div class="info-col">
            <div class="info-item">
                <strong>Name</strong>
                <input type="text" value="Firstname Lastname">
            </div>
            <div class="info-item">
                <strong>Address</strong>
                <textarea rows="2">1 Kennington Rd&#10;London, SE11 6HR</textarea>
            </div>
            <div class="info-item">
                <strong>Email</strong>
                <input type="text" value="firstname@lastname.co.uk">
            </div>
        </div>

        <div class="info-col">
            <div class="info-item">
                <strong>Birthday</strong>
                <input type="text" value="5th January 1982 in London">
            </div>
            <div class="info-item">
                <strong>Phone</strong>
                <input type="text" value="+44 20 1111 1111">
            </div>
        </div>

        <div class="info-col-img">
            <img src="https://via.placeholder.com/140x180?text=Profile+Photo" alt="Profile Photo" class="profile-pic">
        </div>
    </div>

    <div class="section">
        <div class="section-header">Career</div>
        <div class="section-body">
            <div class="row">
                <div class="row-left">
                    <input type="text" value="seit 11/2016">
                </div>
                <div class="row-right">
                    <input type="text" class="bold-input" value="Another Challenge Ltd.">
                    <input type="text" value="Team assistant">
                    <textarea rows="3">• Overview of key responsibilities&#10">• Skills, experience and achievements</textarea>
                </div>
            </div>
            <div class="row">
                <div class="row-left">
                    <input type="text" value="05/2014 - 10/2016">
                </div>
                <div class="row-right">
                    <input type="text" class="bold-input" value="Second Step PLC">
                    <input type="text" value="Personal assistant">
                    <textarea rows="2">• Overview of key responsibilities</textarea>
                </div>
            </div>
            <div class="row">
                <div class="row-left">
                    <input type="text" value="01/2012 - 02/2014">
                </div>
                <div class="row-right">
                    <input type="text" class="bold-input" value="First and One Ltd.">
                    <input type="text" value="Intern in marketing">
                    <textarea rows="2">• Overview of key responsibilities</textarea>
                </div>
            </div>
        </div>
    </div>

    <div class="section">
        <div class="section-header">Education</div>
        <div class="section-body">
            <div class="row">
                <div class="row-left">
                    <input type="text" value="10/2007 - 10/2011">
                </div>
                <div class="row-right">
                    <input type="text" class="bold-input" value="London School of Economics">
                    <input type="text" value="BSc Management">
                    <textarea rows="2">• Emphasis in Marketing and Management</textarea>
                </div>
            </div>
            <div class="row">
                <div class="row-left">
                    <input type="text" value="09/2004 - 07/2007">
                </div>
                <div class="row-right">
                    <input type="text" class="bold-input" value="Example Company Limited">
                    <input type="text" value="Apprenticeship as office clerk">
                    <textarea rows="2">• Scope of training, experience and achievements</textarea>
                </div>
            </div>
        </div>
    </div>

    <div class="section">
        <div class="section-header">Skills and Interests</div>
        <div class="section-body">
            <div class="row">
                <div class="row-left">Language skills</div>
                <div class="row-right">
                    <input type="text" value="English: native speaker">
                    <input type="text" value="Spanish: fluent">
                </div>
            </div>
            <div class="row">
                <div class="row-left">Computer skills</div>
                <div class="row-right">
                    <input type="text" value="Working knowledge: MS Office">
                    <input type="text" value="Basic knowledge: Adobe Photoshop">
                </div>
            </div>
            <div class="row">
                <div class="row-left">Interests</div>
                <div class="row-right">
                    <textarea rows="2">Reading, Sports (Football) and Running), Travelling</textarea>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <input type="text" value="London, 1st January 2023" style="margin-bottom: 15px;">
        <div class="signature">
            <img src="https://via.placeholder.com/150x60?text=Signature" alt="Signature">
        </div>
    </div>
</div>

</body>
</html>
